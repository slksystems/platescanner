name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # If your site needs a build step (npm, Hugo, Jekyll, etc.), add it here
      # and set `path:` in the upload step to the build output directory (e.g. ./build or ./public).

      - name: Configure Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact for deployment
        uses: actions/upload-pages-artifact@v1
        with:
          path: .  # change to ./docs or your build output dir if needed

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
